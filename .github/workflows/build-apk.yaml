name: Build APK

on:
    push:
        branches: [main]
    workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions

jobs:
    apk:
        name: Analyse, tests et APK Android
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Installer Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Installer Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true

            - name: Dépendances
              run: flutter pub get

            - name: Analyse statique
              run: flutter analyze

            - name: Tests
              run: flutter test

            - name: Compiler l'APK (release)
              run: flutter build apk --release --dart-define=API_BASE=https://goodpizza.duckdns.org/api

            - name: Publier l'APK en artefact
              uses: actions/upload-artifact@v4
              with:
                  name: good-pizza-apk
                  path: build/app/outputs/flutter-apk/app-release.apk
                  retention-days: 30
